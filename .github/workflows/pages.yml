# Build the editor and publish it to GitHub Pages.
#
# There is nothing to run on a server: the whole thing is a static site, and
# every PDF is opened, edited and saved inside the visitor's own browser.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time, and a newer push wins
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # the site lives under /Online-Pdf-Editor/, so every asset it asks for
      # has to be addressed from there
      - run: npm run build:pages
      # switches Pages on if it is not already, so the first run of this
      # workflow on a fresh repository deploys rather than failing
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
